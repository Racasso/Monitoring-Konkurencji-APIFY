services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "uvicorn app.api:app --host 0.0.0.0 --port $${API_PORT:-8000}"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-competitor_monitoring}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-apify/instagram-scraper}
      APIFY_MAX_ITEMS_PER_RUN: ${APIFY_MAX_ITEMS_PER_RUN:-250}
      APIFY_MAX_TOTAL_CHARGE_USD_PER_RUN: ${APIFY_MAX_TOTAL_CHARGE_USD_PER_RUN:-0.70}
      MAX_POSTS_PER_COMPETITOR: ${MAX_POSTS_PER_COMPETITOR:-50}
      ANALYSIS_WINDOW_DAYS: ${ANALYSIS_WINDOW_DAYS:-30}
      API_PORT: ${API_PORT:-8000}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      mongo:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-competitor_monitoring}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-apify/instagram-scraper}
      APIFY_MAX_ITEMS_PER_RUN: ${APIFY_MAX_ITEMS_PER_RUN:-250}
      APIFY_MAX_TOTAL_CHARGE_USD_PER_RUN: ${APIFY_MAX_TOTAL_CHARGE_USD_PER_RUN:-0.70}
      MAX_POSTS_PER_COMPETITOR: ${MAX_POSTS_PER_COMPETITOR:-50}
      ANALYSIS_WINDOW_DAYS: ${ANALYSIS_WINDOW_DAYS:-30}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
